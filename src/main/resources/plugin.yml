name: McAI
version: 1.0.1
author: xiaobingkuai123
main: cn.xiaobingkuai123.mcai.McAI
api-version: '1.21'
folia-supported: true
softdepend: [Vault, floodgate, PlaceholderAPI]
libraries:
  - com.google.code.gson:gson:2.10.1
commands:
  ai:
    description: AI对话
    usage: "§c/ai help"
    aliases: [askai]
permissions:
  mcai.public.use:
    default: true
  mcai.use:
    default: true
  mcai.admin:
    default: op
  mcai.group.vip:
    default: false
  mcai.group.admin:
    default: op
