######################################################################
#                             McAI 配置文件
#
# 这是一个 Minecraft AI 插件配置示例。
# 项目地址：https://github.com/xiaobingkuai123/mcai
#
# 配置结构：
#   ai.adapters -> 厂商连接、API 协议和厂商专属选项
#   ai.personal -> 玩家私人 AI 的四种模式、提示词和私人会话设置
#   ai.public   -> 服务器公共 AI 的独立配置
#
# 本版本不兼容旧配置结构。修改本文件后请完整填写新的 ai 区域。
#
# thinking.enabled 控制模型是否进行思考。
# thinking.strength 控制思考强度：
#   type: effort -> OpenAI、DeepSeek 等使用 low/medium/high
#   type: budget -> Gemini 2.5、Anthropic 等使用 token 数量
#   type: level  -> Gemini 3 等使用 minimal/low/medium/high
#
# thinking.display 控制玩家看到什么：
#   none      -> 不显示思考内容
#   summary   -> 只显示厂商提供的可读摘要
#   reasoning -> 显示协议提供的思考内容；DeepSeek 的 reasoning_content 属于此类，
#                不是厂商生成的摘要
#
# 三家 Provider 的协议不会混用：
#   OpenAI 读取 Responses API 的 reasoning summary。
#   DeepSeek 读取 Chat Completions 的 reasoning_content。
#   Gemini 读取 GenerateContent parts 中 thought=true 的文本。
######################################################################

language: "zh_CN"

ai:
  ####################################################################
  #                          AI 适配器
  #
  # 这里只配置连接和协议。个人模式、公共 AI 使用哪个模型，分别在
  # ai.personal.modes 和 ai.public 中配置。
  ####################################################################
  adapters:
    # 所有适配器共用的 HTTP 和采样参数。具体 Provider 不支持的字段会被忽略。
    request:
      timeout-seconds: 120
      max-retries: 1
      temperature: 0.7
      top-p: 1.0
      streaming: true

    openai:
      api-type: "responses"
      api-key: "sk-xxx"
      base-url: "https://api.openai.com"
      responses:
        reasoning-summary:
          enabled: true
          level: "auto"
          # 只有列出的模型才请求 OpenAI reasoning summary。
          supported-models:
            - "gpt-6.1-sol"

    deepseek:
      api-type: "chat"
      api-key: "sk-xxx"
      base-url: "https://api.deepseek.com"
      # DeepSeek 的 reasoning_content 是原始思考内容，不是摘要。

    gemini:
      api-type: "generate-content"
      api-key: "AIza..."
      base-url: "https://generativelanguage.googleapis.com"
      generate-content:
        cached-content:
          enabled: false

    anthropic:
      api-type: "messages"
      api-key: "sk-ant-xxx"
      base-url: "https://api.anthropic.com"
      api-version: "2023-06-01"

  ####################################################################
  #                          私人 AI
  #
  # 每个模式都可以独立选择厂商、模型、思考强度和展示类型。
  #
  # normal           -> 普通模式
  # normal-thinking  -> 普通思考模式
  # advanced         -> 高级模式
  # advanced-thinking-> 高级思考模式
  ####################################################################
  personal:
    enabled: true
    prompt:
      system: >
        你是 Minecraft 服务器中的私人 AI 助手。
        请直接回答玩家问题，回答清晰、准确、简洁。
        在能够完整解决问题的前提下，尽量控制在 50 字以内。
        如果问题确实需要较长说明，再适当增加长度。

    modes:
      normal:
        provider: "openai"
        model: "gpt-4o-mini"
        thinking:
          enabled: false
          display: "none"
        output:
          max-tokens: 4096

      normal-thinking:
        provider: "deepseek"
        model: "deepseek-reasoner"
        thinking:
          enabled: true
          strength:
            type: "effort"
            value: "high"
          display: "reasoning"
        output:
          max-tokens: 64000

      advanced:
        provider: "gemini"
        model: "gemini-2.5-flash"
        thinking:
          enabled: false
          display: "none"
        output:
          max-tokens: 4096

      advanced-thinking:
        provider: "openai"
        model: "gpt-6.1-sol"
        thinking:
          enabled: true
          strength:
            type: "effort"
            value: "high"
          display: "summary"
        output:
          max-tokens: 32768

    history:
      mode: "sliding"
      max-rounds: 20
      persistence:
        enabled: true

    streaming:
      enabled: true
      update-ticks: 4
      preview-code-points: 48
      reasoning-buffer-code-points: 96
      bossbar-hold-ticks: 40
      answer-delay-ticks: 20
      # true 时允许思考内容在回答前进入私人聊天；display=none 时仍不会显示。
      show-thinking-in-chat: true

    console:
      max-history: 30
      log-to-console: false

  ####################################################################
  #                          公共 AI
  #
  # 公共 AI 使用独立共享历史、提示词、费用和展示设置，不继承私人 AI 模式。
  ####################################################################
  public:
    enabled: true
    trigger: "AI"
    provider: "openai"
    model: "gpt-6.1-sol"
    cost-points: 1

    prompt:
      system: >
        你是 Minecraft 服务器的公共 AI 助手。
        你的回答会展示给服务器中的多个玩家。
        请避免泄露玩家私人信息，回答清晰、简洁并遵守服务器规则。
        在能够完整解决问题的前提下，尽量控制在 80 字以内。
    context:
      player-template: "{player}"

    thinking:
      enabled: true
      strength:
        type: "effort"
        value: "medium"
      # OpenAI 使用 summary；DeepSeek 可使用 reasoning；关闭则使用 none。
      display: "summary"

    output:
      max-tokens: 32768

    streaming:
      enabled: true
      audience: "all"
      buffer-code-points: 96
      flush-interval-ms: 500

    history:
      mode: "sliding"
      max-rounds: 20
      persistence:
        enabled: false

points:
  normal-cost: 1
  normal-think-cost: 2
  pro-cost: 3
  pro-think-cost: 6
  cost-per-point: 100.0
  max-buy-per-day: 20

rate-limit:
  enabled: true
  per-minute: 3

daily-limit:
  enabled: true

permissions:
  groups:
    default:
      max-points: 10
      max-question-length: 200
      max-history: 5
    vip:
      permission: "mcai.group.vip"
      max-points: 50
      max-question-length: 500
      max-history: 10
    admin:
      permission: "mcai.group.admin"
      max-points: -1
      max-question-length: 0
      max-history: 20

sounds:
  enabled: true
  global-volume: 0.5
  global-pitch: 1.0
  menu-open: {sound: "BLOCK_CHEST_OPEN", volume: 0.6, pitch: 1.0}
  button-click: {sound: "UI_BUTTON_CLICK", volume: 0.4, pitch: 1.2}
  thinking-start: {sound: "BLOCK_NOTE_BLOCK_CHIME", volume: 0.5, pitch: 1.5}
  reasoning-done: {sound: "BLOCK_NOTE_BLOCK_BELL", volume: 0.4, pitch: 0.8}
  answer: {sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 0.3, pitch: 1.0}
  buy-success: {sound: "ENTITY_PLAYER_LEVELUP", volume: 0.7, pitch: 1.0}
  buy-fail: {sound: "BLOCK_ANVIL_LAND", volume: 0.3, pitch: 0.5}
  points-exhausted: {sound: "BLOCK_FIRE_EXTINGUISH", volume: 0.4, pitch: 0.8}
  history-cleared: {sound: "BLOCK_LAVA_EXTINGUISH", volume: 0.4, pitch: 1.0}
