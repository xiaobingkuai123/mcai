# --------------------------------
# McAI Configuration File
#
# Private and public AI conversations for Minecraft, with Bukkit and Folia scheduling.
# GitHub: https://github.com/xiaobingkuai123/mcai
#
# Configure API keys and ensure each model matches the selected protocol before use.
# ai.adapters defines connections; ai.personal and ai.public define separate sessions.
# Use an API root as the Base URL, not a complete chat request URL.
# Reload with /ai reload; failed validation retains the previous valid settings.
# --------------------------------

# Message language: zh_CN or en_US are bundled; cache logs are always bilingual.
language: "zh_CN"

# AI connections and conversations
ai:
  # Provider connections. Each mode's provider must match a connection below.
  adapters:
    # Shared request settings. Sampling depends on the protocol, model, and thinking mode.
    request:
      # Per-request timeout in seconds, including streaming requests.
      timeout-seconds: 120
      # Maximum retries for retryable failures; 0 disables retries. Visible output is never replayed.
      max-retries: 1
      # Sampling temperature, sent only where supported. Follow the provider's accepted range.
      temperature: 0.7
      # Nucleus sampling, sent only where supported; thinking models may reject it.
      top-p: 1.0
      # Global streaming switch; the private/public streaming switch must also be enabled.
      streaming: true
      # Log bilingual cache statistics, including cache hits and misses.
      # Disabling this hides cache logs only; caching and Token Usage reporting remain enabled.
      log-cache-usage: true

    # OpenAI Responses API or Chat Completions.
    openai:
      # responses selects Responses API; chat selects Chat Completions.
      api-type: "responses"
      # Replace the API key placeholder. Never publish a configuration containing real keys.
      api-key: "sk-xxx"
      # Official API root or compatible gateway; /v1 is added when absent.
      base-url: "https://api.openai.com"
      responses:
        # Official Responses API reasoning summaries; not used by Chat Completions.
        reasoning-summary:
          # Request summaries for models in the allowlist below.
          enabled: true
          # Summary level: auto, concise, or detailed. The model must support it.
          level: "auto"
          # Exact model IDs that may receive reasoning.summary.
          supported-models:
            - "gpt-6.1-sol"

    # DeepSeek Chat Completions; thinking.enabled selects the thinking mode.
    deepseek:
      # DeepSeek uses the chat protocol.
      api-type: "chat"
      # DeepSeek official or compatible gateway API key.
      api-key: "sk-xxx"
      # Both the official root and /v1 are supported; proxy path prefixes are preserved.
      # Only trailing slashes are removed before appending /chat/completions.
      base-url: "https://api.deepseek.com"

    # Gemini Developer API with native GenerateContent.
    gemini:
      # Gemini uses the generate-content protocol.
      api-type: "generate-content"
      # API key sent through the x-goog-api-key header.
      api-key: "AIza..."
      # API root; /v1beta/models/ and the model request path are appended.
      base-url: "https://generativelanguage.googleapis.com"
      generate-content:
        cached-content:
          # Enable explicit Gemini context caching; the model/server must support cachedContent.
          enabled: false

    # Anthropic Messages API with model-specific thinking capabilities.
    anthropic:
      # Anthropic uses the messages protocol.
      api-type: "messages"
      # API key sent through the x-api-key header.
      api-key: "sk-ant-xxx"
      # Official API root or compatible Messages API gateway.
      base-url: "https://api.anthropic.com"
      # API version sent through the anthropic-version header.
      # Versions from 2026-10-21 omit temperature, top_p, and top_k.
      api-version: "2023-06-01"

  # Private sessions with independently configured providers, models, and thinking.
  personal:
    enabled: true
    prompt:
      # Private system prompt. A suggested word limit is not a token limit.
      system: >
        你是 Minecraft 服务器中的私人 AI 助手。
        请直接回答玩家问题，回答清晰、准确、简洁。
        在能够完整解决问题的前提下，尽量控制在 50 字以内。
        如果问题确实需要较长说明，再适当增加长度。

    # normal: standard; normal-thinking: standard thinking; advanced: pro; advanced-thinking: pro thinking.
    # provider references ai.adapters; model must be supported by that connection.
    # Strength: effort for OpenAI, DeepSeek, and supported Anthropic models;
    # budget for Gemini 2.5 and traditional Anthropic; level for Gemini 3.
    # Display: none hides thinking; summary shows official summaries; reasoning shows protocol thinking text.
    # DeepSeek uses reasoning or none; Gemini and Anthropic use summary or none.
    # Supported newer Anthropic models use adaptive; mandatory-thinking models use a supported low mode.
    # Display settings never remove Anthropic signatures or Gemini Thought Signatures from history.
    modes:
      normal:
        provider: "openai"
        model: "gpt-4o-mini"
        thinking:
          enabled: false
          display: "none"
        output:
          max-tokens: 4096

      normal-thinking:
        provider: "deepseek"
        model: "deepseek-flash"
        thinking:
          enabled: true
          strength:
            type: "effort"
            value: "high"
          display: "reasoning"
        output:
          max-tokens: 64000

      advanced:
        provider: "gemini"
        model: "gemini-2.5-flash"
        thinking:
          enabled: false
          display: "none"
        output:
          max-tokens: 4096

      advanced-thinking:
        provider: "openai"
        model: "gpt-6.1-sol"
        thinking:
          enabled: true
          strength:
            type: "effort"
            value: "high"
          display: "summary"
        output:
          max-tokens: 32768

    # Private history is isolated per player; only complete answers or valid refusals are committed.
    history:
      # sliding keeps recent rounds; accumulate requires a new session after reaching the limit.
      mode: "sliding"
      # Private history setting; effective player limits come from permissions.groups.<group>.max-history.
      max-rounds: 20
      persistence:
        # Persist private history to history/<UUID>.yml.
        # Clearing history deletes existing files and invalidates old requests even when this is disabled.
        enabled: true

    streaming:
      # Private streaming; ai.adapters.request.streaming must also be enabled.
      enabled: true
      # BossBar update interval in server ticks; clamped to 1-4 ticks.
      update-ticks: 4
      # BossBar preview length in Unicode code points; clamped to 1-64.
      preview-code-points: 48
      # Reserved setting. Private thinking currently flushes at 96 code points, a newline, or 500 ms.
      reasoning-buffer-code-points: 96
      # BossBar hold time after final output, in ticks; 0 hides it immediately.
      bossbar-hold-ticks: 40
      # Delay in ticks between thinking and the final answer for non-streaming output.
      answer-delay-ticks: 20
      # Allow thinking text in private chat; display: none still hides it.
      show-thinking-in-chat: true

    console:
      # History round limit for the console's private conversation.
      max-history: 30
      # Log requests and answers to the console; logs may contain conversation text.
      log-to-console: false

  # Public sessions share one history with independent models, prompts, and costs.
  public:
    # Enable public AI access.
    enabled: true
    # Public chat trigger: AI matches @AI <question>. Do not include spaces.
    trigger: "AI"
    # Connection name under ai.adapters.
    provider: "openai"
    # Model ID supported by the selected provider or gateway.
    model: "gpt-6.1-sol"
    # Points per public request, independent of private-mode costs.
    cost-points: 1

    prompt:
      # Public system prompt; answers may be shown to multiple players.
      system: >
        你是 Minecraft 服务器的公共 AI 助手。
        你的回答会展示给服务器中的多个玩家。
        请避免泄露玩家私人信息，回答清晰、简洁并遵守服务器规则。
        在能够完整解决问题的前提下，尽量控制在 80 字以内。
    context:
      # Player context template with {player} and optional PlaceholderAPI placeholders.
      player-template: "{player}"

    # Same thinking rules as private modes; strength and display must match provider capabilities.
    thinking:
      # Request thinking; mandatory-thinking models use a supported low-thinking configuration.
      enabled: true
      strength:
        # effort, budget, or level, depending on the provider and model.
        type: "effort"
        # Typically low/medium/high for effort; token count for budget; model-specific Gemini level.
        value: "medium"
      # none hides thinking; summary for Responses/Gemini/Anthropic; reasoning for DeepSeek.
      display: "summary"

    output:
      # Output token limit, not character count. Thinking may use the budget; truncated answers are not committed.
      max-tokens: 32768

    streaming:
      # Public streaming; ai.adapters.request.streaming must also be enabled.
      enabled: true
      # BossBar viewers: all online players or asker only. Final public answers are still broadcast.
      audience: "all"
      # Reserved setting. Public deltas currently update BossBars, not buffered chat batches.
      buffer-code-points: 96
      # Public BossBar refresh setting in milliseconds; actual interval is at most 200 ms.
      flush-interval-ms: 500

    history:
      # sliding keeps recent rounds; accumulate starts the public limit-decision flow when full.
      mode: "sliding"
      # Shared public history round limit, at least 1.
      max-rounds: 20
      persistence:
        # Persist public history to history/public-ai.yml.
        # Disabling persistence or clearing public history deletes old files without affecting private history.
        enabled: false

# Points and purchases. Private requests use mode costs; public requests use ai.public.cost-points.
points:
  # Points per private normal-mode request.
  normal-cost: 1
  # Points per private normal-thinking request.
  normal-think-cost: 2
  # Points per private advanced-mode request.
  pro-cost: 3
  # Points per private advanced-thinking request.
  pro-think-cost: 6
  # Economy currency charged per purchased point.
  cost-per-point: 100.0
  # Maximum points purchasable per day; negative values mean unlimited.
  max-buy-per-day: 20

# Request rate limits
rate-limit:
  # Enable per-player request rate limits.
  enabled: true
  # Requests allowed per player in a rolling 60-second window.
  per-minute: 3

# Daily usage limits
daily-limit:
  # Enable daily usage limits; permission-group point quotas are configured below.
  enabled: true

# Permission groups
permissions:
  # Default fallback group; other groups match their permission node.
  # max-points: daily quota (-1 unlimited); max-question-length: question length (0 unlimited).
  # max-history: private history round limit; 0 retains no history.
  groups:
    default:
      max-points: 10
      max-question-length: 200
      max-history: 5
    vip:
      permission: "mcai.group.vip"
      max-points: 50
      max-question-length: 500
      max-history: 10
    admin:
      permission: "mcai.group.admin"
      max-points: -1
      max-question-length: 0
      max-history: 20

# Interaction sounds
sounds:
  # Enable interaction sounds.
  enabled: true
  # Global volume multiplier, multiplied by each sound's volume.
  global-volume: 0.5
  # Global pitch multiplier, multiplied by each sound's pitch.
  # sound uses Bukkit Sound enum names; volume and pitch are per-sound settings.
  global-pitch: 1.0
  menu-open: {sound: "BLOCK_CHEST_OPEN", volume: 0.6, pitch: 1.0}
  button-click: {sound: "UI_BUTTON_CLICK", volume: 0.4, pitch: 1.2}
  thinking-start: {sound: "BLOCK_NOTE_BLOCK_CHIME", volume: 0.5, pitch: 1.5}
  reasoning-done: {sound: "BLOCK_NOTE_BLOCK_BELL", volume: 0.4, pitch: 0.8}
  answer: {sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 0.3, pitch: 1.0}
  buy-success: {sound: "ENTITY_PLAYER_LEVELUP", volume: 0.7, pitch: 1.0}
  buy-fail: {sound: "BLOCK_ANVIL_LAND", volume: 0.3, pitch: 0.5}
  points-exhausted: {sound: "BLOCK_FIRE_EXTINGUISH", volume: 0.4, pitch: 0.8}
  history-cleared: {sound: "BLOCK_LAVA_EXTINGUISH", volume: 0.4, pitch: 1.0}
