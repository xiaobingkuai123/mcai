# Language filename under the plugin's lang/ directory, without the .yml extension (for example: zh_CN).
# Default: zh_CN. If the selected file is missing or invalid, the plugin falls back to zh_CN.
language: "zh_CN"

api:
  normal-provider: "deepseek"
  pro-provider: "deepseek"
  timeout-seconds: 120
  request:
    # Shared defaults. Adapters omit unsupported provider-specific fields.
    temperature: 0.7
    top-p: 1.0
    max-retries: 1
    streaming: true
    thinking:
      enabled: true
      # Token budget reserved for model reasoning. Default: 4096; minimum: 1024; no plugin-imposed upper limit (the provider/model may impose one).
      budget: 4096
    reasoning-effort: "medium"
  deepseek:
    key: "sk-xxx"
    base-url: "https://api.deepseek.com"
    api-type: "chat"
    normal-model: "deepseek-v4.1-flash"
    normal-think-model: "deepseek-v4-pro"
    pro-model: "deepseek-v4.1-flash"
    pro-think-model: "deepseek-v4-pro"
    # Maximum generated output tokens for non-thinking requests. Default: 4096; minimum: 1; no plugin-imposed upper limit (the provider/model may impose one).
    max-tokens-fast: 4096
    # Maximum generated output tokens for thinking requests. Default: 64000; minimum: 1; no plugin-imposed upper limit (the provider/model may impose one).
    max-tokens-think: 64000
  openai:
    key: "sk-xxx"
    base-url: "https://api.openai.com"
    # Use responses for OpenAI reasoning models. Chat Completions gpt-4o is not a reasoning model.
    api-type: "responses"
    normal-model: "gpt-6.1-sol"
    normal-think-model: "gpt-6.1-sol"
    pro-model: "gpt-6.1-sol"
    pro-think-model: "gpt-6.1-sol"
    reasoning-summary:
      enabled: true
      level: "auto"
      models:
        - "gpt-6.1-sol"
    # Maximum generated output tokens for non-thinking requests. Default: 4096; minimum: 1; no plugin-imposed upper limit (the provider/model may impose one).
    max-tokens-fast: 4096
    # Maximum generated output tokens for thinking requests. Default: 32768; minimum: 1; no plugin-imposed upper limit (the provider/model may impose one).
    max-tokens-think: 32768
  anthropic:
    key: "sk-ant-xxx"
    base-url: "https://api.anthropic.com"
    api-type: "messages"
    api-version: "2023-06-01"
    normal-model: "claude-sonnet-4-20250514"
    normal-think-model: "claude-sonnet-4-20250514"
    pro-model: "claude-opus-4-20250514"
    pro-think-model: "claude-opus-4-20250514"
    # Maximum generated output tokens for non-thinking requests. Default: 4096; minimum: 1; no plugin-imposed upper limit (the provider/model may impose one).
    max-tokens-fast: 4096
    # Maximum generated output tokens for thinking requests. Default: 32768; minimum: 1; no plugin-imposed upper limit (the provider/model may impose one).
    max-tokens-think: 32768
  gemini:
    key: "AIza..."
    base-url: "https://generativelanguage.googleapis.com"
    api-type: "gemini"
    cached-content:
      # Explicit Gemini Cached Content is optional; unsupported gateways fall back to inline history.
      enabled: false
    normal-model: "gemini-2.5-flash"
    normal-think-model: "gemini-2.5-flash"
    pro-model: "gemini-2.5-pro"
    pro-think-model: "gemini-2.5-pro"
    # Maximum generated output tokens for non-thinking requests. Default: 4096; minimum: 1; no plugin-imposed upper limit (the provider/model may impose one).
    max-tokens-fast: 4096
    # Maximum generated output tokens for thinking requests. Default: 32768; minimum: 1; no plugin-imposed upper limit (the provider/model may impose one).
    max-tokens-think: 32768

chat:
  system-prompt: "You are a helpful Minecraft server assistant. Answer briefly and clearly."
  # Console history is independent of player permission groups.
  console-max-history: 30
  log-to-console: false
  think-delay-ticks: 20
  history:
    # sliding retains the latest rounds; accumulate blocks new requests at the permission group's max-history.
    mode: sliding
    persistence:
      enabled: true
  round-prompt:
    enabled: true
  streaming:
    enabled: true
    update-ticks: 4
    window-chars: 48
    show-reasoning-in-chat: true
    bossbar-hold-ticks: 40

points:
  normal-cost: 1
  normal-think-cost: 2
  pro-cost: 3
  pro-think-cost: 6
  cost-per-point: 100.0
  max-buy-per-day: 20

rate-limit:
  enabled: true
  per-minute: 3

daily-limit:
  enabled: true

# Permission groups share quota, question-length, and conversation-history limits.
# Groups are checked in file order; the last matching permission group takes precedence.
permissions:
  groups:
    default:
      # The fallback group is used when no other configured permission matches.
      max-points: 10
      max-question-length: 200
      # Maximum history rounds retained in sliding mode and allowed in accumulate mode.
      max-history: 5
    vip:
      permission: "mcai.group.vip"
      max-points: 50
      max-question-length: 500
      # Maximum history rounds retained in sliding mode and allowed in accumulate mode.
      max-history: 10
    admin:
      permission: "mcai.group.admin"
      max-points: -1
      max-question-length: 0
      # Maximum history rounds retained in sliding mode and allowed in accumulate mode.
      max-history: 20

sounds:
  enabled: true
  global-volume: 0.5
  global-pitch: 1.0
  menu-open: {sound: "BLOCK_CHEST_OPEN", volume: 0.6, pitch: 1.0}
  button-click: {sound: "UI_BUTTON_CLICK", volume: 0.4, pitch: 1.2}
  thinking-start: {sound: "BLOCK_NOTE_BLOCK_CHIME", volume: 0.5, pitch: 1.5}
  reasoning-done: {sound: "BLOCK_NOTE_BLOCK_BELL", volume: 0.4, pitch: 0.8}
  answer: {sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 0.3, pitch: 1.0}
  buy-success: {sound: "ENTITY_PLAYER_LEVELUP", volume: 0.7, pitch: 1.0}
  buy-fail: {sound: "BLOCK_ANVIL_LAND", volume: 0.3, pitch: 0.5}
  points-exhausted: {sound: "BLOCK_FIRE_EXTINGUISH", volume: 0.4, pitch: 0.8}
  history-cleared: {sound: "BLOCK_LAVA_EXTINGUISH", volume: 0.4, pitch: 1.0}
